{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<section class="form-column" aria-labelledby="password-heading">
  <h1 id="password-heading">Đổi mật khẩu</h1>
  <form method="post" action="/admin/change-password" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current-password">Mật khẩu hiện tại</label>
    <input id="current-password" name="current_password" type="password" autocomplete="current-password" required autofocus>
    <label for="new-password">Mật khẩu mới</label>
    <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <label for="confirm-password">Xác nhận mật khẩu mới</label>
    <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <button class="primary-button" type="submit">Đổi mật khẩu</button>
  </form>
</section>
{% endblock %}
