{% extends "base.html" %}
{% block title %}Đăng nhập quản trị{% endblock %}
{% block shell_class %}auth-shell{% endblock %}
{% block content %}
<section class="auth-panel" aria-labelledby="login-heading">
  <h1 id="login-heading">Đăng nhập quản trị</h1>
  <form method="post" action="/admin/login" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Tên đăng nhập</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary-button" type="submit">Đăng nhập</button>
  </form>
</section>
{% endblock %}
