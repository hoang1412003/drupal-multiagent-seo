{% extends "base.html" %}
{% block title %}Tạo người dùng{% endblock %}
{% block content %}
<header class="page-heading">
  <div>
    <p class="eyebrow">Phân quyền</p>
    <h1>Tạo người dùng</h1>
    <p class="lede">Tài khoản mới buộc đổi mật khẩu ở lần đăng nhập đầu tiên.</p>
  </div>
  <a class="secondary-link" href="/admin/users">Quay lại danh sách</a>
</header>

<section class="detail-band form-column">
  <form method="post" action="/admin/users" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="new-username">Tên đăng nhập</label>
    <input id="new-username" name="username" maxlength="200" autocomplete="off" required autofocus>
    <label for="new-role">Role</label>
    <select id="new-role" name="role" required>
      {% for role in roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}
    </select>
    <p class="form-help">Mật khẩu tạm thời sẽ chỉ xuất hiện một lần sau khi tạo.</p>
    <button class="primary-button" type="submit">Tạo tài khoản</button>
  </form>
</section>
{% endblock %}
