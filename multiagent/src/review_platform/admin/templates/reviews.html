{% extends "base.html" %}
{% block title %}Lịch sử chấm{% endblock %}
{% block content %}
<header class="page-heading">
  <div>
    <p class="eyebrow">Truy vết</p>
    <h1>Lịch sử chấm</h1>
    <p class="lede">Đọc lại quyết định, bằng chứng và cấu hình của từng run đã lưu.</p>
  </div>
</header>

<form
  class="filter-panel review-filters"
  action="/admin/reviews"
  method="get"
  hx-get="/admin/reviews"
  hx-target="#reviews-table"
  hx-swap="outerHTML"
  aria-label="Lọc lịch sử chấm"
>
  <label for="review-decision">Quyết định</label>
  <select id="review-decision" name="decision">
    <option value="">Tất cả</option>
    {% for decision in ["publish", "needs_revision", "rejected", "unknown"] %}
      <option
        value="{{ decision }}"
        {% if filter_values.get("decision") == decision %}selected{% endif %}
      >{{ decision }}</option>
    {% endfor %}
  </select>
  <label for="review-site">Website</label>
  <input
    id="review-site"
    name="site"
    value="{{ filter_values.get('site', '') }}"
    placeholder="slug hoặc UUID"
  >
  <label for="review-external">External ID</label>
  <input
    id="review-external"
    name="external_id"
    value="{{ filter_values.get('external_id', '') }}"
    maxlength="100"
  >
  <label for="review-from">Từ ngày</label>
  <input id="review-from" name="from" type="date" value="{{ filter_values.get('from', '') }}">
  <label for="review-to">Đến ngày</label>
  <input id="review-to" name="to" type="date" value="{{ filter_values.get('to', '') }}">
  <label for="review-page-size">Số dòng</label>
  <select id="review-page-size" name="page_size">
    {% for size in [25, 50, 100] %}
      <option
        value="{{ size }}"
        {% if filter_values.get("page_size", "25") == size|string %}selected{% endif %}
      >{{ size }}</option>
    {% endfor %}
  </select>
  <button class="secondary-button" type="submit">Lọc lịch sử</button>
</form>

{% if not error %}
  {% include "partials/reviews_table.html" %}
{% endif %}
{% endblock %}
