<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Platform Admin{% endblock %} · VF O2O Multi-Agent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/vendor/htmx-2.0.10.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua điều hướng</a>
  <header class="site-header">
    <a class="brand" href="/admin">VF O2O Multi-Agent</a>
    {% if user %}
    <nav class="primary-nav" aria-label="Điều hướng quản trị">
      <a href="/admin"{% if request.url.path == '/admin' %} aria-current="page"{% endif %}>Tổng quan</a>
    </nav>
    <div class="session-nav">
      <p class="header-identity">
        <strong>{{ user.username }}</strong>
        <span>{{ user.role.value }}</span>
      </p>
      <a href="/admin/change-password"{% if request.url.path == '/admin/change-password' %} aria-current="page"{% endif %}>Đổi mật khẩu</a>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="nav-action" type="submit">Đăng xuất</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main id="main-content" class="page-shell {% block shell_class %}{% endblock %}">
    {% if flash or error %}
    <div class="global-messages">
      {% if flash %}<p class="notice success" role="status">{{ flash }}</p>{% endif %}
      {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
