{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<header class="page-heading">
  <div>
    <p class="eyebrow">Vận hành</p>
    <h1>Jobs</h1>
    <p class="lede">Tra cứu hàng đợi chấm theo website, trạng thái và nội dung.</p>
  </div>
</header>

<form
  class="filter-panel job-filters"
  action="/admin/jobs"
  method="get"
  hx-get="/admin/jobs"
  hx-target="#jobs-table"
  hx-swap="outerHTML"
  aria-label="Lọc jobs"
>
  <label for="job-status">Trạng thái</label>
  <select id="job-status" name="status">
    <option value="">Tất cả</option>
    {% for status in ["queued", "running", "failed", "done", "superseded"] %}
      <option value="{{ status }}"{% if filter_values.get("status") == status %} selected{% endif %}>
        {{ status }}
      </option>
    {% endfor %}
  </select>
  <label for="job-site">Website</label>
  <input id="job-site" name="site" value="{{ filter_values.get('site', '') }}" placeholder="slug hoặc UUID">
  <label for="job-source">Nguồn</label>
  <input id="job-source" name="source" value="{{ filter_values.get('source', '') }}" maxlength="100">
  <label for="job-external">External ID</label>
  <input
    id="job-external"
    name="external_id"
    value="{{ filter_values.get('external_id', '') }}"
    maxlength="100"
  >
  <label for="job-from">Từ ngày</label>
  <input id="job-from" name="from" type="date" value="{{ filter_values.get('from', '') }}">
  <label for="job-to">Đến ngày</label>
  <input id="job-to" name="to" type="date" value="{{ filter_values.get('to', '') }}">
  <label for="job-page-size">Số dòng</label>
  <select id="job-page-size" name="page_size">
    {% for size in [25, 50, 100] %}
      <option
        value="{{ size }}"
        {% if filter_values.get("page_size", "25") == size|string %}selected{% endif %}
      >{{ size }}</option>
    {% endfor %}
  </select>
  <button class="secondary-button" type="submit">Lọc jobs</button>
</form>

{% if not error %}
  {% include "partials/jobs_table.html" %}
{% endif %}
{% endblock %}
