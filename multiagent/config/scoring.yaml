# Trọng số và ngưỡng của hệ Multi-Agent, khoá theo (content_type, langcode).
#
# Đặc tả đầy đủ: docs/config-spec.md
#
# LÝ DO FILE NÀY TỒN TẠI: cùng một con số từng nằm ở 5 nơi (graph.py,
# label_helper.py, rubrics.md, annotation-guideline.md, và - phát hiện muộn -
# ngay trong chuỗi system prompt của agents/seo.py) và ĐÃ TRÔI LỆCH hai lần,
# cả hai lần đều ở cùng con số: mã B3 ghi 150-160 trong khi rubric ghi
# 140-170. Bản trong prompt SEO giữ lại đúng con số sai đó và sống sót qua cả
# đợt tách config, vì grep theo tên biến không thấy ngưỡng nằm trong chuỗi.
# Config không phải để "cho có kiến trúc đẹp" mà để CON SỐ CHỈ TỒN TẠI Ở MỘT
# CHỖ - và scripts/test_seo_prompt.py khoá nốt bản chép cuối cùng còn lại.
#
# Dùng YAML thay vì JSON vì những con số này CẦN CHÚ THÍCH: "tại sao 30 từ",
# "giá trị tạm chờ calibrate". JSON không có comment, mà mất phần giải thích
# là mất gần hết giá trị.
#
# KHÔNG SỬA TAY khối đã calibrate. Muốn đổi ngưỡng thì chạy lại calibration
# (docs/evaluation-plan.md E5) - sửa tay làm mất mối liên hệ giữa con số và
# bằng chứng sinh ra nó.

version: 1

# Tra cứu theo khoá "<content_type>:<langcode>". Không có khoá khớp -> dùng
# "default". KHÔNG kế thừa/gộp từng phần: mỗi khoá là một khối đầy đủ, để
# đọc file là biết chắc hệ thống đang chạy bằng số nào.
default:

  # --- Xuất xứ: khối này do calibration (evaluation-plan.md E5) ghi ra -----
  meta:
    calibrated: false            # false = đang dùng giá trị minh hoạ
    calibrated_at: null
    gold_set: null               # ví dụ "labels.csv @ 1ceeb2f"
    guideline_version: null      # v1.2
    rubric_version: null         # v1
    prompt_version: null         # hash/tag của bộ system prompt
    model: null                  # model đã dùng khi calibrate
    kappa: null                  # Kappa đạt được, để đối chiếu về sau

  # --- Aggregator ---------------------------------------------------------
  # Trọng số phản ánh mức nghiêm trọng của hậu quả khi tiêu chí bị vi phạm
  # (docs/architecture.md mục 6.1). Compliance cao nhất vì hậu quả pháp lý;
  # SEO thấp nhất vì phần lớn sửa được sau khi đăng.
  # GIÁ TRỊ TẠM - Sprint 3 calibrate lại từ gold set.
  weights:
    content_quality: 0.25
    seo: 0.20
    brand: 0.25
    compliance: 0.30

  decision:
    publish_min: 80              # >= -> publish
    needs_revision_min: 50       # >= -> needs_revision, dưới -> rejected
    compliance_veto_below: 50    # điểm Compliance dưới mức này -> rejected

  # --- Ngưỡng CHẤM ĐIỂM (docs/rubrics.md) --------------------------------
  # Dải "lý tưởng", dùng để cho điểm từng phần.
  scoring:
    title_ideal: [50, 60]        # ký tự -> SEO1 mức 2
    title_acceptable: [40, 70]   # -> SEO1 mức 1; ngoài dải này là mức 0
    meta_ideal: [140, 170]       # -> SEO3 mức 2
    url_max_chars: 75            # -> SEO5 mức 1 khi vượt
    body_min_words: 600          # -> SEO7 mức 2; dưới 300 là mức 0
    body_thin_words: 300         # -> SEO7 ranh giới mức 0/1
    internal_link_min: 3         # -> SEO10 mức 2; 1-2 link là mức 1
    # 45 chu khong phai 30. So 30 la quy uoc readability TIENG ANH, von dem
    # TU; con phep dem o day la len(s.split()) tren tieng Viet viet roi tung
    # am tiet, tuc dem TIENG ("o to dien" = 1 tu ghep, 3 tieng). 45 tieng ~ 30
    # tu, dung chuan goc ma so 30 muon ve.
    #
    # Ly do doi phat bieu duoc MA KHONG NHAC toi phan bo thu duoc - do la phep
    # thu de phan biet "sua cho dung" voi "chinh cho phan bo dep" (bay B9).
    # (De tham chieu: o nguong 30, CQ3 cho 33/33 bai muc 0, tuc khong phan
    # biet duoc bai nao voi bai nao.)
    #
    # CO Y KHAC labelling.long_sentence_words = 30. Ben do chi la BO DEM ghi
    # vao cot notes, khong quyet dinh nhan gi, va giu 30 de so lieu C4 da ghi
    # trong labels.csv con so sanh duoc. Ben nay QUYET DINH MUC nen chuan dung
    # dan cao hon. Hai ho nguong co y tach bach - config-spec.md muc 2.
    long_sentence_words: 45      # -> CQ3
    long_paragraph_sentences: 5  # -> CQ4
    heading_required_words: 500  # -> CQ5 (bài dài mà không có h2)
    loi_it: 1                    # -> CQ1/CQ2: 1-2 lỗi = mức 1
    loi_nhieu: 3                 # -> CQ1/CQ2: >=3 lỗi = mức 0

  # --- Ngưỡng GÁN NHÃN (docs/goldset/annotation-guideline.md) ------------
  # CỐ Ý khác họ scoring - đọc docs/config-spec.md mục 2 TRƯỚC KHI SỬA.
  # Lý do khác nhau: nếu dùng dải lý tưởng 50-60 làm ranh giới NHÃN thì gần
  # như mọi bài thật đều dính lỗi -> tất cả thành needs_revision -> phân bố
  # nhãn sụp đổ -> Kappa mất ý nghĩa. Nhãn dùng dải "sai rõ ràng".
  labelling:
    title_ok: [40, 70]           # ngoài dải -> B4
    meta_ok: [140, 170]          # ngoài dải -> B3
    url_max_chars: 75            # -> B7
    # HAI NGƯỠNG DƯỚI KHÔNG QUYẾT ĐỊNH NHÃN (guideline v1.3). Chúng sinh mã
    # C4/C5, mà mã nhóm C chỉ ghi vào `notes` chứ không quy ra nhãn. Nên
    # KHÔNG cần calibrate chúng ở E5, và cũng không được đối xử với chúng
    # như title_ok/meta_ok ở trên.
    #
    # Đơn vị là TIẾNG, không phải TỪ: label_helper đếm bằng len(s.split()),
    # mà tiếng Việt viết rời từng âm tiết ("ô tô điện" = 1 từ, 3 tiếng). Con
    # số 30 mượn từ quy ước readability tiếng Anh vốn đếm TỪ, nên nó chưa bao
    # giờ đo đúng thứ định đo - giữ nguyên 30 để số liệu C4 so được với các
    # lần chạy trước, vì nay nó chỉ còn là bộ đếm.
    long_sentence_words: 30      # -> C4 (không đổi nhãn)
    long_paragraph_sentences: 5  # -> C5 (không đổi nhãn)
    repeat_threshold: 3          # số lần lặp mới tính là lỗi, dùng cho C4/C5
    heading_required_words: 500  # -> B9 (lỗi cấu trúc, CÓ đổi nhãn)

  # --- Retrieval (docs/rag-design.md mục 4.4) ----------------------------
  retrieval:
    top_k_factcheck: 3
    top_k_brand: 3
    min_similarity: null         # chốt từ bộ eval E2

# Khoá thật của phạm vi hiện tại. Trước khi calibrate, để y hệt default.
"cam_nang:vi":

  meta:
    calibrated: false
    calibrated_at: null
    gold_set: null
    guideline_version: null
    rubric_version: null
    prompt_version: null
    model: null
    kappa: null

  weights:
    content_quality: 0.25
    seo: 0.20
    brand: 0.25
    compliance: 0.30

  decision:
    publish_min: 80
    needs_revision_min: 50
    compliance_veto_below: 50

  scoring:
    title_ideal: [50, 60]
    title_acceptable: [40, 70]
    meta_ideal: [140, 170]
    url_max_chars: 75
    body_min_words: 600
    body_thin_words: 300
    internal_link_min: 3
    long_sentence_words: 45      # KHAC labelling (30) - xem khoi default
    long_paragraph_sentences: 5
    heading_required_words: 500
    loi_it: 1
    loi_nhieu: 3

  labelling:
    title_ok: [40, 70]
    meta_ok: [140, 170]
    url_max_chars: 75
    # long_sentence_words/long_paragraph_sentences sinh mã C4/C5 và KHÔNG
    # quyết định nhãn - không calibrate chúng. Đơn vị là TIẾNG không phải TỪ.
    # Giải thích đầy đủ ở khối `default` phía trên và guideline v1.3 mục 4.3.
    long_sentence_words: 30
    long_paragraph_sentences: 5
    repeat_threshold: 3
    heading_required_words: 500  # -> B9, CÓ đổi nhãn

  retrieval:
    top_k_factcheck: 3
    top_k_brand: 3
    min_similarity: null
